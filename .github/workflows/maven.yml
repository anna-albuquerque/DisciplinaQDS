name: Java CI

on: 
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Java ${{ matrix.java }}
    strategy:
      matrix:
        java: [21]

    steps:
      - uses: actions/checkout@v4.2.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4.5.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Install jscpd globally
        run: npm install -g jscpd 
        
      - name: Build with Maven
        run: mvn clean install

      - name: Cache local Maven repository
        uses: actions/cache@v4.2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: mvn test

      - name: Set up Graphviz
        uses: ts-graphviz/setup-graphviz@v2.0.2

      - name: Validate
        run: ./mvnw -B clean validate

      - name: Tests
        run: ./mvnw -B verify

      - name: Checkstyle
        run: ./mvnw -B -Pcheckstyle validate

      - name: Pmd
        run: ./mvnw -B -Ppmd validate

      - name: Cpd
        run: ./mvnw -B -Pcpd validate

      - name: Download PlantUML 
        run: wget http://sourceforge.net/projects/plantuml/files/plantuml.jar/download -O plantuml.jar #baixar PlantUML

      - name: Generate UML Diagrams 
        run: | 
          java -jar plantuml.jar -tpng -o diagrams uml/todos.puml

      - name: Upload UML Diagrams 
        uses: actions/upload-artifact@v4.4.3 
        with:
          name: uml-diagrams 
          path: uml/diagrams/ 
          
      #- name: PlantUML
      #  run: ./mvnw -B -Pplantuml generate-test-sources
        
      - name: Decycle
        run: ./mvnw -B -Pdecycle -DskipTests verify

      - name: Duplicate
        run: ./mvnw -B -Pduplicate -DskipTests verify

      - name: Spotbugs
        run: ./mvnw -B -Pspotbugs -DskipTests process-test-classes
